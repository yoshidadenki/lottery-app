
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>数字抽選・購入アプリ</title>
<style>
:root {
  --bg:#f3f4f6;--card:#fff;--text:#111827;
  --muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--danger:#991b1b;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
.wrap{max-width:820px;margin:auto;padding:18px 14px 40px}
h1{font-size:26px;margin:8px 0}
.sub,.note,.status{color:var(--muted);line-height:1.7;font-size:13px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:17px;margin:15px 0;
}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font-family:inherit;cursor:pointer}
.mode-btn{
  padding:13px 7px;border:2px solid var(--line);
  background:#fff;border-radius:13px;font-weight:700;
}
.mode-btn.active{border-color:var(--accent);color:var(--accent);background:#eff6ff}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:9px;margin-top:15px}
.primary,.danger{
  border:0;border-radius:13px;padding:15px 8px;
  font-size:16px;font-weight:800;
}
.primary{background:var(--accent);color:#fff}
.danger{background:#fee2e2;color:var(--danger)}
.ticket{
  background:#f9fafb;border:1px solid var(--line);
  border-radius:12px;padding:12px;margin:9px 0;
}
.ticket-title{font-size:12px;color:var(--muted);margin-bottom:6px}
.ticket-nums{font-size:17px;font-weight:800;line-height:1.7;word-break:break-word}
.audit{
  padding:13px;border-radius:12px;background:#ecfdf5;
  color:#065f46;margin-top:12px;line-height:1.8;font-size:13px;
}
.audit.error{background:#fef2f2;color:#991b1b}
.numbers{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px 0}
.ball{
  display:grid;place-items:center;width:50px;height:50px;
  border-radius:50%;background:#eef2ff;color:#1e3a8a;
  font-size:20px;font-weight:800;
}
.remaining{display:flex;flex-wrap:wrap;gap:6px}
.mini{
  padding:8px;background:#f3f4f6;border-radius:8px;
  min-width:35px;text-align:center;
}
.placeholder{color:#9ca3af;text-align:center;padding:12px}
h2{font-size:18px}
@media(min-width:680px){
  .mode-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<main class="wrap">
<h1>数字抽選・購入アプリ</h1>
<p class="sub">
暗号学的乱数で数字を生成。
研究済み構造を維持し、生成結果を監査します。
当せんを予測する機能ではありません。
</p>

<section class="card">
<div class="mode-grid">
<button class="mode-btn active" data-mode="noRepeat">重複なし</button>
<button class="mode-btn" data-mode="resetEach">毎回リセット</button>
<button class="mode-btn" data-mode="miniFull">ミニロト Full Coverage</button>
<button class="mode-btn" data-mode="miniV4">ミニロト V4.0</button>
<button class="mode-btn" data-mode="bingoFull">BINGO5 Full Coverage</button>
<button class="mode-btn" data-mode="bingoV4">BINGO5 V4.0</button>
</div>
<p id="status" class="status"></p>
</section>

<section class="card" id="normalCard">
<h2>数字抽選</h2>
<div class="numbers" id="normalResult">
<div class="placeholder">「5個引く」を押してください</div>
</div>
<div class="actions">
<button class="primary" id="drawBtn">5個引く</button>
<button class="danger" id="normalReset">全部リセット</button>
</div>
</section>

<section class="card" id="portfolioCard" hidden>
<h2 id="portfolioTitle"></h2>
<p id="portfolioDescription" class="note"></p>
<div id="ticketList"></div>
<div id="audit" class="audit" hidden></div>
<div class="actions">
<button class="primary" id="generateBtn">作成</button>
<button class="danger" id="portfolioReset">リセット</button>
</div>
</section>

<section class="card" id="remainingCard">
<h2>残り数字 <span id="remainingCount"></span></h2>
<div id="remaining" class="remaining"></div>
</section>

<section class="card" id="historyCard">
<h2>抽選履歴</h2>
<div id="history"></div>
</section>
</main>

<script>
"use strict";

const ALL31=Array.from({length:31},(_,i)=>i+1);
const RANGES=Array.from({length:8},(_,c)=>
  Array.from({length:5},(_,i)=>c*5+i+1)
);

const MINI_V4=[
  [3,20,22,23,25],
  [10,13,15,17,30],
  [1,24,26,27,29],
  [14,16,18,19,28],
  [2,4,6,7,31]
];

const BINGO_V4=[
  [1,6,11,16,21,26,31,36],
  [2,7,12,16,22,26,34,37],
  [3,7,12,17,21,29,33,36],
  [4,7,11,17,22,28,33,39],
  [5,7,15,16,21,27,33,37]
];

const $=id=>document.getElementById(id);
const fmt=n=>String(n).padStart(2,"0");

function randomInt(max){
  if(!Number.isSafeInteger(max)||max<=0||max>4294967296)
    throw Error("Invalid random range");
  const size=4294967296;
  const limit=Math.floor(size/max)*max;
  const buf=new Uint32Array(1);
  while(true){
    crypto.getRandomValues(buf);
    if(buf[0]<limit)return buf[0]%max;
  }
}

function shuffle(source){
  const a=[...source];
  for(let i=a.length-1;i>0;i--){
    const j=randomInt(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function usage(tickets){
  const m=new Map();
  for(const t of tickets)
    for(const n of t)m.set(n,(m.get(n)||0)+1);
  return m;
}

function overlap(a,b){
  const s=new Set(a);
  return b.filter(n=>s.has(n)).length;
}

function legalMini(tickets,n){
  return tickets.length===n&&tickets.every(t=>
    t.length===5&&new Set(t).size===5&&
    t.every(x=>Number.isInteger(x)&&x>=1&&x<=31)
  );
}

function auditMiniV4(t){
  if(!legalMini(t,5))return false;
  const u=usage(t);
  if(u.size!==25||[...u.values()].some(v=>v!==1))
    return false;
  for(let i=0;i<5;i++)
    for(let j=i+1;j<5;j++)
      if(overlap(t[i],t[j])!==0)return false;
  return true;
}

function auditMiniFull(t){
  if(!legalMini(t,7))return false;
  const u=usage(t);
  if(u.size!==31)return false;
  if(ALL31.some(n=>!u.has(n)))return false;
  if([...u.values()].filter(v=>v===2).length!==4)
    return false;
  if([...u.values()].filter(v=>v===1).length!==27)
    return false;

  let edges=0;
  for(let i=0;i<7;i++){
    for(let j=i+1;j<7;j++){
      const k=overlap(t[i],t[j]);
      if(j===6){
        if(k>1)return false;
        if(k===1)edges++;
      }else if(k!==0)return false;
    }
  }
  return edges===4;
}

function auditBingoFull(t){
  if(t.length!==5)return false;
  if(t.some(row=>row.length!==8))return false;
  const u=usage(t);
  if(u.size!==40||[...u.values()].some(v=>v!==1))
    return false;
  return t.every(row=>row.every((n,c)=>
    Number.isInteger(n)&&RANGES[c].includes(n)
  ));
}

function auditBingoV4(t){
  if(t.length!==5||t.some(row=>row.length!==8))
    return false;

  if(!t.every(row=>row.every((n,c)=>
    Number.isInteger(n)&&RANGES[c].includes(n)
  )))return false;

  for(let c=0;c<8;c++){
    const actual=t.map(row=>row[c]);
    const source=BINGO_V4.map(row=>row[c]);

    for(let i=0;i<5;i++){
      for(let j=i+1;j<5;j++){
        if((actual[i]===actual[j])!==
           (source[i]===source[j]))return false;
      }
    }

    const actualCounts=[...usage(actual.map(n=>[n])).values()]
      .sort((a,b)=>a-b);
    const sourceCounts=[...usage(source.map(n=>[n])).values()]
      .sort((a,b)=>a-b);
    if(JSON.stringify(actualCounts)!==
       JSON.stringify(sourceCounts))return false;
  }

  for(let i=0;i<5;i++){
    for(let j=i+1;j<5;j++){
      if(overlap(t[i],t[j])!==
         overlap(BINGO_V4[i],BINGO_V4[j]))
        return false;
    }
  }
  return new Set(t.map(row=>row.join(","))).size===5;
}

function makeMiniV4(){
  const labels=[...new Set(MINI_V4.flat())].sort((a,b)=>a-b);
  const targets=shuffle(ALL31).slice(0,25);
  const map=new Map(labels.map((n,i)=>[n,targets[i]]));
  return MINI_V4.map(row=>
    row.map(n=>map.get(n)).sort((a,b)=>a-b)
  );
}

function makeMiniFull(){
  const a=shuffle(ALL31);
  const t=Array.from({length:6},(_,i)=>
    a.slice(i*5,i*5+5).sort((x,y)=>x-y)
  );
  const selected=shuffle([0,1,2,3,4,5]).slice(0,4);
  const extras=selected.map(i=>t[i][randomInt(5)]);
  t.push([a[30],...extras].sort((x,y)=>x-y));
  return t;
}

function makeBingoFull(){
  const cols=RANGES.map(shuffle);
  return Array.from({length:5},(_,r)=>
    cols.map(col=>col[r])
  );
}

function makeBingoV4(){
  const maps=RANGES.map(range=>{
    const shuffled=shuffle(range);
    return new Map(range.map((n,i)=>[n,shuffled[i]]));
  });
  return BINGO_V4.map(row=>
    row.map((n,c)=>maps[c].get(n))
  );
}

const modes={
  miniFull:{
    title:"ミニロト Full Coverage｜7口",
    description:"31/31 Full Coverage＋4-edge-star",
    generate:makeMiniFull,
    audit:auditMiniFull,
    count:7
  },
  miniV4:{
    title:"ミニロト V4.0｜5口",
    description:"25数字重複なし・研究済みV4.0型",
    generate:makeMiniV4,
    audit:auditMiniV4,
    count:5
  },
  bingoFull:{
    title:"BINGO5 Full Coverage｜5口",
    description:"40/40 Full Coverage・全数字1回",
    generate:makeBingoFull,
    audit:auditBingoFull,
    count:5
  },
  bingoV4:{
    title:"BINGO5 V4.0｜5口",
    description:"研究済みセル共有構造を維持",
    generate:makeBingoV4,
    audit:auditBingoV4,
    count:5
  }
};

let mode="noRepeat";
let remaining=[...ALL31];
let history=[];

function renderNormal(){
  $("remainingCount").textContent=`${remaining.length}個`;
  $("remaining").replaceChildren();
  for(const n of remaining){
    const d=document.createElement("div");
    d.className="mini";
    d.textContent=fmt(n);
    $("remaining").append(d);
  }
  $("history").replaceChildren();
  if(history.length===0){
    $("history").textContent="まだ履歴はありません";
    return;
  }
  history.forEach((h,i)=>{
    const d=document.createElement("div");
    d.className="ticket";
    d.textContent=`第${history.length-i}回：${h.map(fmt).join("・")}`;
    $("history").append(d);
  });
}

function drawFive(){
  const pool=mode==="noRepeat"?remaining:ALL31;
  if(pool.length<5){
    alert("残り数字が5個未満です。リセットしてください。");
    return;
  }
  const picked=shuffle(pool).slice(0,5).sort((a,b)=>a-b);
  if(mode==="noRepeat"){
    const s=new Set(picked);
    remaining=remaining.filter(n=>!s.has(n));
  }
  history.unshift(picked);
  $("normalResult").replaceChildren();
  picked.forEach(n=>{
    const d=document.createElement("div");
    d.className="ball";
    d.textContent=fmt(n);
    $("normalResult").append(d);
  });
  renderNormal();
}

function resetNormal(){
  remaining=[...ALL31];
  history=[];
  $("normalResult").innerHTML=
    '<div class="placeholder">「5個引く」を押してください</div>';
  renderNormal();
}

function renderTickets(tickets){
  $("ticketList").replaceChildren();
  tickets.forEach((row,i)=>{
    const d=document.createElement("div");
    d.className="ticket";
    const title=document.createElement("div");
    title.className="ticket-title";
    title.textContent=`${i+1}口目`;
    const nums=document.createElement("div");
    nums.className="ticket-nums";
    nums.textContent=row.map(fmt).join("　");
    d.append(title,nums);
    $("ticketList").append(d);
  });
}

function generatePortfolio(){
  const cfg=modes[mode];
  if(!cfg)return;
  try{
    const tickets=cfg.generate();
    const valid=cfg.audit(tickets);
    const audit=$("audit");
    audit.hidden=false;
    audit.classList.toggle("error",!valid);
    if(!valid){
      $("ticketList").replaceChildren();
      audit.textContent="監査エラー：構造条件を満たしていません。";
      return;
    }
    renderTickets(tickets);
    audit.textContent=
      `チェックOK｜${cfg.count}口｜構造監査PASS｜`+
      "Random Source: crypto.getRandomValues()";
  }catch(e){
    $("ticketList").replaceChildren();
    $("audit").hidden=false;
    $("audit").classList.add("error");
    $("audit").textContent="生成エラー："+e.message;
  }
}

function setMode(next){
  mode=next;
  document.querySelectorAll(".mode-btn").forEach(btn=>
    btn.classList.toggle("active",btn.dataset.mode===mode)
  );

  const normal=mode==="noRepeat"||mode==="resetEach";
  $("normalCard").hidden=!normal;
  $("portfolioCard").hidden=normal;
  $("remainingCard").hidden=mode!=="noRepeat";
  $("historyCard").hidden=!normal;

  if(normal){
    $("status").textContent=mode==="noRepeat"?
      "重複なし：一度引いた数字は除外します。":
      "毎回リセット：毎回1〜31から抽選します。";
  }else{
    const cfg=modes[mode];
    $("portfolioTitle").textContent=cfg.title;
    $("portfolioDescription").textContent=cfg.description;
    $("status").textContent=cfg.description;
    resetPortfolio();
  }
  renderNormal();
}

function resetPortfolio(){
  $("ticketList").replaceChildren();
  $("ticketList").innerHTML=
    '<div class="placeholder">「作成」を押してください</div>';
  $("audit").hidden=true;
  $("audit").textContent="";
  $("audit").classList.remove("error");
}

document.querySelectorAll(".mode-btn").forEach(btn=>
  btn.addEventListener("click",()=>setMode(btn.dataset.mode))
);
$("drawBtn").addEventListener("click",drawFive);
$("normalReset").addEventListener("click",resetNormal);
$("generateBtn").addEventListener("click",generatePortfolio);
$("portfolioReset").addEventListener("click",resetPortfolio);

setMode("noRepeat");
</script>
</body>
</html>
